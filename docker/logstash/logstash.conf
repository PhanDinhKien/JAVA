input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Extract service name from logger_name if not set
  if [service_name] {
    mutate {
      add_field => { "service" => "%{service_name}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservice-logs-%{+YYYY.MM.dd}"
  }

  # Also print to stdout for debugging Logstash itself
  stdout {
    codec => rubydebug
  }
}
