input {
  # Consume logs từ Kafka topic thay vì TCP trực tiếp
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["microservice-logs"]
    group_id => "logstash-consumer"
    codec => json
    # Đọc từ earliest nếu Logstash restart (không bỏ sót log)
    auto_offset_reset => "earliest"
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Extract service name from logger_name if not set
  if [service_name] {
    mutate {
      add_field => { "service" => "%{service_name}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservice-logs-%{+YYYY.MM.dd}"
  }

  # Debug: in ra stdout
  stdout {
    codec => rubydebug
  }
}
