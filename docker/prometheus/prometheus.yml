# Prometheus Configuration
# Scrape metrics từ các Spring Boot services qua /actuator/prometheus

global:
  scrape_interval: 15s       # Thu thập metrics mỗi 15 giây
  evaluation_interval: 15s   # Đánh giá rules mỗi 15 giây

scrape_configs:
  # Prometheus tự monitor chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # User Service — chạy trên host machine port 8081
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'user-service'

  # Order Service — chạy trên host machine port 8082
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'order-service'

  # API Gateway — chạy trên host machine port 8080
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
