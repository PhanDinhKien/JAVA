server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: auth-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            - id: student-service
              uri: lb://user-service
              predicates:
                - Path=/api/students/**
            # Swagger proxy - truy cập Swagger của user-service qua gateway
            - id: user-service-swagger-ui
              uri: lb://user-service
              predicates:
                - Path=/swagger-ui/**,/swagger-ui.html
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/**
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
