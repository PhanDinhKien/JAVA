server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: auth-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            - id: student-service
              uri: lb://user-service
              predicates:
                - Path=/api/students/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            # Swagger proxy - user-service (UI + api-docs)
            - id: user-service-swagger-ui
              uri: lb://user-service
              predicates:
                - Path=/user-service/swagger-ui/**
              filters:
                - RewritePath=/user-service(?<segment>.*), ${segment}
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs/**
              filters:
                - RewritePath=/user-service(?<segment>.*), ${segment}

            # Swagger proxy - order-service (UI + api-docs)
            - id: order-service-swagger-ui
              uri: lb://order-service
              predicates:
                - Path=/order-service/swagger-ui/**
              filters:
                - RewritePath=/order-service(?<segment>.*), ${segment}
            - id: order-service-api-docs
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs/**
              filters:
                - RewritePath=/order-service(?<segment>.*), ${segment}

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
